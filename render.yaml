# Render blueprint — hosts the AgentS landing page as a static site.
# The AgentS app itself is local-first (runs on your machine); only the
# landing page + download button belongs in the cloud.
services:
  - type: web
    name: agents-landing
    runtime: static
    buildCommand: echo "Landing page is prebuilt — no build step"
    staticPublishPath: ./docs
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
